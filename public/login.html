<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Placas · Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #161616;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    p.sub { margin: 0 0 22px; font-size: 13px; color: #a3a3a3; }
    label { display: block; font-size: 12px; color: #a3a3a3; margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 9px;
      color: #f5f5f5;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #525252; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px 12px;
      background: #f5f5f5;
      color: #0a0a0a;
      border: 0;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .err {
      margin-top: 12px;
      font-size: 12.5px;
      color: #fca5a5;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <form class="card" id="f" autocomplete="off">
    <h1>Placas</h1>
    <p class="sub">Ingresá tus credenciales para continuar.</p>

    <label for="u">Usuario</label>
    <input id="u" name="username" type="text" autocomplete="username" required autofocus />

    <label for="p">Contraseña</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required />

    <button id="b" type="submit">Entrar</button>
    <div class="err" id="e"></div>
  </form>

  <script>
    const f = document.getElementById('f');
    const b = document.getElementById('b');
    const e = document.getElementById('e');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      e.textContent = '';
      b.disabled = true;
      b.textContent = 'Verificando…';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('u').value,
            password: document.getElementById('p').value,
          }),
        });
        if (r.ok) {
          window.location.replace('/');
          return;
        }
        if (r.status === 401) e.textContent = 'Usuario o contraseña incorrectos.';
        else e.textContent = 'Error del servidor (' + r.status + ').';
      } catch (err) {
        e.textContent = 'No se pudo conectar.';
      } finally {
        b.disabled = false;
        b.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
